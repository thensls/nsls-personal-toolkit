<div x-data="{ coachMode: true }" class="bg-white rounded-lg shadow p-6 max-w-2xl mx-auto">
  <div class="mb-5 pb-4 border-b">
    {% with when='morning', label="How's your energy this morning?", value=morning_energy %}{% include "_components/energy_row.html" %}{% endwith %}
  </div>

  {% include "_components/plan_your_day.html" %}

  <div class="mt-6 flex justify-end">
    <button hx-post="/lock-in" hx-vals='{"phase":"morning"}'
            hx-select="main" hx-target="main" hx-swap="outerHTML"
            class="px-4 py-2 bg-blue-900 text-white rounded">Done — show Command Center →</button>
  </div>
</div>
