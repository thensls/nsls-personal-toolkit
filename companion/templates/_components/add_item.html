{# Command Center "Add an item" panel: type a task, pick Top 3 or Bonus, Add.
   Posts to /move-item (view=command, add=1); the response replaces the task
   lanes and, out of band, the confirmation line below. #}
<section class="nsls-card">
  <h2 class="nsls-section-title">Add an item</h2>
  <p class="nsls-section-sub">Capture a new task without leaving the Command Center.</p>
  <form class="nsls-add-item" hx-post="/move-item" hx-target="#task-table" hx-swap="outerHTML"
        hx-vals='{"view": "command", "add": "1"}' hx-sync="this:drop"
        hx-on:htmx:after-request="if(event.detail.successful){const i=this.querySelector('input'); i.value=''; i.focus()}"
        hx-on:htmx:response-error="window.__toolkitErrorToast(event)">
    <input type="text" name="text" placeholder="What needs to be done?" autocomplete="off"
           aria-label="New task" required maxlength="256">
    <select name="to" aria-label="Where it goes">
      <option value="top_3">Today · Top 3</option>
      <option value="bonus" selected>Today · Bonus</option>
    </select>
    <button type="submit" class="nsls-btn-gold">Add item</button>
  </form>
  <p id="add-item-status" class="nsls-add-status" aria-live="polite"></p>
</section>
