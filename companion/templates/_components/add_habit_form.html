<div id="manage-habits-panel" class="bg-white rounded-lg shadow p-4 mb-4">
  <h3 class="font-semibold text-lg mb-3">Manage habits</h3>

  {% if habits %}
  <div class="mb-4">
    <p class="text-xs uppercase tracking-wider text-stone-500 mb-2">Current habits</p>
    <ul class="space-y-2">
      {% for h in habits %}
      <li class="flex items-center justify-between border rounded px-3 py-2 gap-2">
        <input type="text" value="{{ h.name }}"
               name="new_name"
               hx-post="/habit/rename"
               hx-vals='{"habit_id": "{{ h.id }}"}'
               hx-target="#habit-form-slot"
               hx-swap="innerHTML"
               hx-trigger="change"
               class="flex-1 text-sm border-0 bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-300 rounded px-1 py-0">
        <button hx-post="/habit/archive"
                hx-vals='{"habit_id": "{{ h.id }}"}'
                hx-target="#habit-form-slot"
                hx-swap="innerHTML"
                class="text-stone-400 hover:text-red-600 text-xs px-2" title="Remove habit">✕</button>
      </li>
      {% endfor %}
    </ul>
  </div>
  {% else %}
  <p class="text-sm text-stone-500 mb-3 italic">No habits yet. Add your first one below.</p>
  {% endif %}

  {% if success_message %}
  <div class="bg-green-50 border border-green-200 rounded p-3 text-sm text-green-900 mb-3">
    ✓ {{ success_message }}
  </div>
  {% endif %}

  <form hx-post="/habit"
        hx-target="#habit-form-slot"
        hx-swap="innerHTML"
        class="border-t pt-3">
    <label class="block text-sm font-semibold text-stone-700 mb-2">Add a habit</label>
    <div class="flex gap-2">
      <input name="name" placeholder="e.g. Walk, Read, Meditate"
             class="flex-1 border rounded px-3 py-2 text-sm" required autofocus>
      <button type="submit" class="px-4 py-2 bg-blue-900 text-white rounded text-sm">Add</button>
    </div>
    <p class="text-xs text-stone-500 mt-2">Habits are daily by default. Edit details in <code>30-habits/habits.md</code>.</p>
  </form>

  <div class="mt-3 flex justify-end">
    <button hx-get="/"
            hx-target="main"
            hx-select="main"
            hx-swap="outerHTML"
            class="px-4 py-2 border rounded text-stone-700 text-sm">Done</button>
  </div>
</div>
