<form hx-post="/habit"
      hx-target="#habit-form-slot"
      hx-swap="innerHTML"
      hx-on:htmx:after-request="if (event.detail.successful) this.reset()"
      class="bg-white rounded-lg shadow p-4 mb-4">
  <label class="block text-sm font-semibold text-stone-700 mb-2">Habit name</label>
  <input name="name" placeholder="e.g. Walk, Read, Meditate"
         class="block w-full border rounded px-3 py-2 mb-3" required autofocus>
  <p class="text-xs text-stone-500 mb-3">Habits are daily by default — check them off in the Day tab. You can edit emoji, target, or frequency later by opening <code>30-habits/habits.md</code>.</p>
  <div class="flex gap-2">
    <button type="submit" class="px-4 py-2 bg-blue-900 text-white rounded">Add habit</button>
    <button type="button"
            hx-get="/empty"
            hx-target="#habit-form-slot"
            hx-swap="innerHTML"
            class="px-4 py-2 border rounded text-stone-700">Cancel</button>
  </div>
</form>
