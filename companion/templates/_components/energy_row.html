<div id="energy-{{ when }}" class="flex items-center gap-3">
  <span class="text-sm text-stone-500 w-44 shrink-0">{{ label }}</span>
  <div class="flex gap-1">
    {% for lvl, lbl in [("low", "Low"), ("medium", "Med"), ("high", "High")] %}
    <button class="w-14 h-7 text-xs rounded {{ 'bg-blue-700 text-white' if value == lvl else 'bg-stone-100 text-stone-500 hover:bg-stone-200' }}"
            hx-post="/set-energy" hx-vals='{"level":"{{ lvl }}","when":"{{ when }}"}'
            hx-target="#energy-{{ when }}" hx-swap="outerHTML">{{ lbl }}</button>
    {% endfor %}
  </div>
</div>
