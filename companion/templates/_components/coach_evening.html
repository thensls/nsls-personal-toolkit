<div x-data="{ step: {{ step or 1 }} }" data-suppress-sse-reload class="nsls-card max-w-2xl mx-auto">
  <div class="flex gap-1 mb-3">
    {% for i in range(1, 5) %}
      <div class="nsls-prog" :class="step >= {{ i }} ? 'nsls-prog-on' : 'nsls-prog-off'"></div>
    {% endfor %}
  </div>
  <div class="nsls-card-title mb-4">Step <span x-text="step"></span> of 4 · Evening</div>

  <template x-if="step === 1">
    <div>
      <h3 class="font-semibold text-lg mb-3 nsls-h1">Today's stats</h3>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="nsls-stat"><div class="nsls-stat-label">Top 3 completed</div><div class="nsls-stat-value">{{ stats.top_3_done }}/{{ stats.top_3_total }}</div></div>
        <div class="nsls-stat"><div class="nsls-stat-label">Habits completed</div><div class="nsls-stat-value">{{ stats.habits_done }}/{{ stats.habits_total }}</div></div>
        <div class="nsls-stat"><div class="nsls-stat-label">Focus time</div><div class="nsls-stat-value">{{ stats.focus_hours }}h</div></div>
        <div class="nsls-stat"><div class="nsls-stat-label">Streak</div><div class="nsls-stat-value">{{ stats.streak_days }}d</div></div>
      </div>
    </div>
  </template>

  <template x-if="step === 2">
    <div>
      <h3 class="font-semibold text-lg mb-2 nsls-h1">Insight Reflection</h3>
      <p class="text-sm nsls-subtle mb-3">What did you notice about yourself today? One pattern, one resistance, one win — whatever is alive. Auto-saves as you type.</p>
      <textarea rows="8" class="nsls-textarea"
                hx-post="/save" hx-trigger="input changed delay:1500ms"
                hx-vals='{"section":"Insight Reflection"}' name="content"
                hx-swap="none"
                hx-on:htmx:response-error="window.__toolkitErrorToast && window.__toolkitErrorToast(event)">{{ insight_reflection_text }}</textarea>
    </div>
  </template>

  <template x-if="step === 3">
    <div>
      <h3 class="font-semibold text-lg mb-2 nsls-h1">Gratitude</h3>
      <p class="text-sm nsls-subtle mb-3">One thing you're grateful for today. Short or long. Auto-saves as you type.</p>
      <textarea rows="4" class="nsls-textarea"
                hx-post="/save" hx-trigger="input changed delay:1500ms"
                hx-vals='{"section":"Gratitude"}' name="content"
                hx-swap="none"
                hx-on:htmx:response-error="window.__toolkitErrorToast && window.__toolkitErrorToast(event)">{{ gratitude_text }}</textarea>
    </div>
  </template>

  <template x-if="step === 4">
    <div>
      <h3 class="font-semibold text-lg mb-3 nsls-h1">Done for today</h3>
      <div class="mb-4">
        {% with when='evening', label="Energy at day's end?", value=evening_energy %}{% include "_components/energy_row.html" %}{% endwith %}
      </div>
      <p class="nsls-subtle mb-2">Insight and Gratitude saved to today's daily note.</p>
      <p class="text-sm nsls-subtle">Tap Done to switch to the read-only Results view.</p>
    </div>
  </template>

  <div class="mt-6 flex justify-between gap-3">
    <button @click="step--" :disabled="step <= 1"
            class="nsls-btn-ghost disabled:opacity-30">Back</button>
    <button @click="step++" x-show="step < 4"
            class="nsls-btn-teal">Next</button>
    <button x-show="step >= 4"
            hx-post="/lock-in" hx-vals='{"phase":"evening"}'
            hx-select="main" hx-target="main" hx-swap="outerHTML"
            class="nsls-btn-gold">Done →</button>
  </div>
</div>
