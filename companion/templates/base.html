<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSLS Toolkit Companion</title>
  <link rel="stylesheet" href="/static/tailwind.css">
  <!-- htmx + Alpine are vendored locally (companion/static/) so the companion
       works fully offline / behind firewalls that block unpkg. A blocked CDN
       was silently leaving htmx undefined, so every button did nothing. The
       onerror fallbacks only fire if the local file fails to load. -->
  <script src="/static/htmx.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/htmx.org@1.9.10';document.head.appendChild(s);"></script>
  <script defer src="/static/alpine.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.defer=true;s.src='https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js';document.head.appendChild(s);"></script>
</head>
<body class="bg-stone-50 text-stone-900">
  {% if test_mode %}<div class="nsls-test-bar">Test vault — practice data, your real day is untouched</div>{% endif %}
  <nav class="nsls-nav">
    <div class="max-w-4xl mx-auto px-6 py-3 flex gap-6">
      <a href="/" class="font-semibold {{ 'nsls-nav-active pb-3' if active_tab == 'day' else '' }}">Day</a>
      <a href="/week" class="font-semibold {{ 'nsls-nav-active pb-3' if active_tab == 'week' else '' }}">Week</a>
      <a href="/streaks" class="font-semibold {{ 'nsls-nav-active pb-3' if active_tab == 'streaks' else '' }}">Streaks</a>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      let es = null;
      let reconnectDelay = 1000;        // backoff base
      let lastReload = Date.now();
      const RELOAD_DEBOUNCE_MS = 800;
      let suppressNextReload = 0;       // timestamp until which SSE reloads are suppressed

      // Suppress SSE reload after our own HTMX POSTs — the broadcast those
      // writes trigger would clobber the view the user just interacted with.
      document.body.addEventListener("htmx:beforeRequest", function (e) {
        if (e.detail.requestConfig && e.detail.requestConfig.verb !== "get") {
          suppressNextReload = Date.now() + 3000;
        }
      });
      document.body.addEventListener("htmx:afterRequest", function (e) {
        // Extend suppression after the response arrives — the SSE broadcast
        // from our write may still be in-flight on the EventSource connection.
        if (e.detail.requestConfig && e.detail.requestConfig.verb !== "get") {
          suppressNextReload = Date.now() + 1000;
        }
      });

      function isMainDirty() {
        // Any textarea inside <main> whose current value differs from its initial
        // value is "dirty" and we should warn before clobbering it.
        for (const t of document.querySelectorAll("main textarea")) {
          if (t.value !== (t.defaultValue || "")) return true;
        }
        return false;
      }

      function reloadMain() {
        if (Date.now() - lastReload < RELOAD_DEBOUNCE_MS) return;
        // Skip SSE reload when any interactive wizard is active — HTMX
        // partial swaps handle the UI updates, and a full main replace
        // would blow away Alpine's step state, causing the screen to jump.
        if (document.querySelector("[x-data*='coachMode']") ||
            document.querySelector("[data-suppress-sse-reload]")) return;
        // Skip SSE reload shortly after our own POST — the broadcast it
        // triggers is from OUR write, not an external change.
        if (Date.now() < suppressNextReload) return;
        lastReload = Date.now();
        if (isMainDirty()) {
          const ok = confirm(
            "The CLI updated this file. Reload and lose the edits you're typing?\n\n" +
            "OK = reload\nCancel = keep my edits (you can refresh manually later)"
          );
          if (!ok) return;
        }
        // Extract only <main> from the response and replace the entire
        // <main> element. Using innerHTML here would shove the full page
        // (including <nav>) into main, producing a duplicated top menu.
        htmx.ajax("GET", window.location.href, {
          target: "main",
          select: "main",
          swap: "outerHTML",
        });
      }

      function connect() {
        if (es) try { es.close(); } catch (_) {}
        es = new EventSource("/events");
        es.onopen = () => { reconnectDelay = 1000; };
        es.onmessage = (e) => {
          const path = e.data;
          if (path.startsWith("01-daily/") || path.startsWith("30-habits/") || path.startsWith("02-weekly/")) {
            reloadMain();
          }
        };
        es.onerror = () => {
          try { es.close(); } catch (_) {}
          setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 2, 30000);  // cap 30s
        };
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          // iOS drops SSE when the tab is backgrounded — refresh + reconnect.
          reloadMain();
          connect();
        }
      });

      connect();

      // Global toast for HTMX response errors. All POSTs in templates use:
      //   hx-on:htmx:response-error="window.__toolkitErrorToast(event)"
      window.__toolkitErrorToast = function (evt) {
        const xhr = evt.detail && evt.detail.xhr;
        const msg = (xhr && xhr.responseText) || "Save failed";
        let toast = document.getElementById("toolkit-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "toolkit-toast";
          toast.className = "fixed bottom-4 right-4 bg-red-700 text-white px-4 py-2 rounded shadow-lg z-50";
          document.body.appendChild(toast);
        }
        toast.textContent = "⚠ " + msg.slice(0, 200);
        toast.style.display = "block";
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.style.display = "none"; }, 4000);
      };
    })();
  </script>
</body>
</html>
